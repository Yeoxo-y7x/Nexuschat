<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkChat Ultimate - Discord Killer v3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            height: 98vh;
            background: #1a1a2e;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(123, 47, 252, 0.5);
            position: relative;
            border: 1px solid #2a2a4a;
        }

        /* Sidebar gauche - Serveurs */
        .sidebar-left {
            width: 80px;
            background: #12121f;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-right: 1px solid #2a2a4a;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-left::-webkit-scrollbar { width: 3px; }
        .sidebar-left::-webkit-scrollbar-thumb { background: #7b2ffc; border-radius: 10px; }

        .server-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 3px solid transparent;
            position: relative;
            flex-shrink: 0;
            color: #aaa;
        }

        .server-icon:hover {
            border-color: #7b2ffc;
            transform: scale(1.1);
            border-radius: 16px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            color: #fff;
        }

        .server-icon.active {
            border-color: #7b2ffc;
            border-radius: 16px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            color: #fff;
            box-shadow: 0 0 20px rgba(123, 47, 252, 0.3);
        }

        .server-icon .crown {
            position: absolute;
            top: -12px;
            right: -8px;
            font-size: 16px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        .server-icon .notif {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: #ff6b6b;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid #12121f;
        }

        .server-divider {
            width: 35px;
            height: 2px;
            background: #2a2a4a;
            border-radius: 1px;
        }

        .server-add {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: transparent;
            border: 2px dashed #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #2a2a4a;
            cursor: pointer;
            transition: 0.3s;
        }

        .server-add:hover {
            border-color: #7b2ffc;
            color: #7b2ffc;
            transform: scale(1.05);
        }

        /* Sidebar serveurs */
        .sidebar-servers {
            width: 250px;
            background: #16162a;
            padding: 20px;
            border-right: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 15px;
        }

        .server-header .name {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-header .name:hover { color: #7b2ffc; }

        .server-header .arrow {
            color: #888;
            font-size: 14px;
            transition: 0.3s;
        }

        .server-header .arrow.open { transform: rotate(180deg); }

        .channel-search {
            padding: 8px 14px;
            background: #0a0a0f;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
            margin-bottom: 15px;
        }

        .channel-search::placeholder { color: #555; }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .channel-list::-webkit-scrollbar { width: 4px; }
        .channel-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .channel-category {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 6px;
            padding-left: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .channel-category:hover { color: #aaa; }

        .channel-item {
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 14px;
            margin: 1px 0;
        }

        .channel-item:hover {
            background: #2a2a4a;
            color: #fff;
        }

        .channel-item.active {
            background: #2a2a4a;
            color: #fff;
        }

        .channel-item .icon { font-size: 16px; }
        .channel-item .lock { margin-left: auto; font-size: 11px; color: #ff6b6b; }
        .channel-item .voice-count {
            margin-left: auto;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .channel-item .voice-count .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Chat principal */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #12121f;
        }

        .chat-header {
            padding: 12px 20px;
            background: #16162a;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 55px;
        }

        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .left h2 {
            font-size: 17px;
            color: #fff;
        }

        .chat-header .left .topic {
            color: #666;
            font-size: 12px;
            padding: 2px 10px;
            background: #0a0a0f;
            border-radius: 12px;
        }

        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .right .online {
            color: #00ff88;
            font-size: 13px;
        }

        .chat-header .right .admin-badge {
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(123, 47, 252, 0.3);
        }

        .chat-header .right .admin-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(123, 47, 252, 0.3);
        }

        /* Messages */
        .messages {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .message {
            padding: 5px 12px;
            border-radius: 8px;
            animation: fadeIn 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: 0.15s;
        }

        .message:hover { background: #1a1a2e; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            position: relative;
        }

        .message .avatar .badge-icon {
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 12px;
        }

        .message .content-wrap { flex: 1; min-width: 0; }

        .message .username {
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .message .username .tag {
            font-size: 10px;
            color: #666;
            font-weight: normal;
        }

        .message .username .role-badge {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 8px;
            font-weight: bold;
        }

        .role-badge.owner { background: #ff6b6b; color: #fff; }
        .role-badge.admin { background: #7b2ffc; color: #fff; }
        .role-badge.moderator { background: #ffaa00; color: #000; }
        .role-badge.booster { background: #ff66ff; color: #fff; }

        .message .content {
            font-size: 14px;
            word-wrap: break-word;
            margin-top: 1px;
        }

        .message .time {
            font-size: 10px;
            color: #444;
            margin-left: 8px;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .message.own .content-wrap {
            background: #2a2a4a;
            padding: 6px 14px;
            border-radius: 12px;
        }

        /* Input */
        .input-area {
            padding: 12px 20px;
            background: #16162a;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area .emoji-btn {
            font-size: 20px;
            cursor: pointer;
            color: #555;
            transition: 0.2s;
            padding: 5px;
        }
        .input-area .emoji-btn:hover { color: #fff; }

        .input-area input {
            flex: 1;
            padding: 10px 18px;
            background: #0a0a0f;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus { box-shadow: 0 0 20px rgba(123, 47, 252, 0.15); }

        .input-area button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(123, 47, 252, 0.3);
        }

        /* Sidebar droit - Membres */
        .sidebar-right {
            width: 240px;
            background: #16162a;
            border-left: 1px solid #2a2a4a;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-right .title {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .member-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .member-list::-webkit-scrollbar { width: 4px; }
        .member-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: 0.15s;
            cursor: pointer;
        }

        .member-item:hover { background: #1a1a2e; }

        .member-item .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            position: relative;
        }

        .member-item .avatar-sm .mini-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            font-size: 9px;
        }

        .member-item .name {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 3px;
            flex: 1;
        }

        .member-item .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online { background: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .status-dot.idle { background: #ffaa00; }
        .status-dot.offline { background: #444; }
        .status-dot.admin { background: #7b2ffc; box-shadow: 0 0 8px rgba(123,47,252,0.4); }
        .status-dot.owner { background: #ff6b6b; box-shadow: 0 0 8px rgba(255,107,107,0.4); }

        /* Voice Overlay */
        .voice-overlay {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 12px 22px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 0 50px rgba(123, 47, 252, 0.25);
            backdrop-filter: blur(15px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95%;
        }

        .voice-overlay.active { display: flex; }

        .voice-overlay .voice-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-overlay .voice-info .channel-name {
            font-weight: bold;
            font-size: 14px;
        }

        .voice-overlay .voice-info .status-text {
            color: #00ff88;
            font-size: 12px;
        }

        .voice-overlay .voice-users {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .voice-overlay .voice-user {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 6px;
            background: #0a0a0f;
            border-radius: 16px;
            font-size: 12px;
        }

        .voice-overlay .voice-user .v-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .voice-overlay .voice-user .speaking {
            color: #00ff88;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        .voice-overlay .voice-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .voice-overlay .voice-controls button {
            padding: 5px 12px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 11px;
        }

        .voice-overlay .voice-controls button:hover { transform: scale(1.05); }
        .voice-overlay .voice-controls .mute-btn { background: #ff6b6b; color: #fff; }
        .voice-overlay .voice-controls .deafen-btn { background: #7b2ffc; color: #fff; }
        .voice-overlay .voice-controls .leave-btn { background: #ff0000; color: #fff; }

        /* Responsive */
        @media (max-width: 1100px) { .sidebar-right { display: none; } }
        @media (max-width: 800px) {
            .sidebar-left { width: 60px; }
            .sidebar-servers { width: 180px; }
            .chat-header .left .topic { display: none; }
        }
        @media (max-width: 600px) {
            .sidebar-left, .sidebar-servers, .sidebar-right { display: none; }
            .container { border-radius: 0; height: 100vh; }
            .voice-overlay { width: 95%; bottom: 80px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sidebar gauche -->
    <div class="sidebar-left" id="serverList"></div>

    <!-- Sidebar serveurs -->
    <div class="sidebar-servers">

    <!-- Chat principal -->

        </div>
    </div>

    <!-- Sidebar droit -->
    <div class="sidebar-right">
        <div class="title">👥 En ligne — <span id="memberCount">42</span></div>
        <div class="member-list" id="memberList"></div>
    </div>

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <div class="voice-info">
            <span style="font-size:18px;">🔊</span>
            <span class="channel-name" id="voiceChannelName">Général</span>
            <span class="status-text">● Connecté</span>
        </div>
        <div class="voice-users" id="voiceUsers"></div>
        <div class="voice-controls">
            <button class="mute-btn" onclick="toggleMute()">🔇 Muet</button>
            <button class="deafen-btn" onclick="toggleDeafen()">🔊 Assourdir</button>
            <button class="leave-btn" onclick="leaveVoice()">✖ Quitter</button>
        </div>
    </div>
</div>

        { name: 'Shadow', tag: '#0001', avatar: 'SH', status: 'idle', role: 'member', badges: [] },
        { name: 'V0idX', tag: '#4040', avatar: 'VX', status: 'online', role: 'member', badges: ['🔰'] },
        { name: 'NeoX', tag: '#0690', avatar: 'NX', status: 'offline', role: 'member', badges: [] },
        { name: 'Cyb3r', tag: '#1338', avatar: 'CY', status: 'online', role: 'member', badges: ['🎖️'] },
        { name: 'Xx_H4x0r_xX', tag: '#6666', avatar: 'XH', status: 'online', role: 'member', badges: [] },
        { name: 'Ghost', tag: '#0000', avatar: 'GH', status: 'idle', role: 'member', badges: [] },
        { name: 'Phantom', tag: '#1234', avatar: 'PH', status: 'online', role: 'member', badges: ['⭐'] },
        { name: 'AdminBot', tag: '#0001', avatar: 'AB', status: 'online', role: 'admin', badges: ['👑'] }

    const owner = { name: 'Tu', tag: '#0001', avatar: 'T', status: 'online', role: 'owner', badges: ['👑', '⭐', '💎', '🏆'] };
    const USERS = [owner, ...baseUsers];

    // Messages
    const MESSAGES = [

        { user: 'HackerMan', content: 'Ici on parle de tout, même des trucs illégaux 😈', time: '12:35' },
        { user: 'Shadow', content: 'J\'ai des leaks de ouf si ça intéresse', time: '12:38' },
        { user: 'AdminBot', content: '⚠️ Ce serveur est hors-la-loi. Tout est permis.', time: '12:40', isAdmin: true },
        { user: 'Tu', content: 'Je suis le propriétaire unique 👑', time: '12:41', isOwner: true }

    const REPLIES = [
        "Bien dit !", "Lol", "T'as raison", "Grave", "Mdr", "T'es un fou",

        "Nan mais t'es sérieux ?", "J'te jure", "Ça c'est chaud",
        "Mdrrr", "T'es un ouf", "J'adore ce serveur", "DarkChat c'est le meilleur",

        "C'est quoi ce délire ?", "Ptdr", "T'as cracké", "Gros brain"
    ];

    // ============================================================
    //  ÉTAT
    // ============================================================
    let currentServer = 'darkchat';
    let currentChannel = 'general';
    let currentVoiceChannel = null;
    let isMuted = false;
    let isDeafened = false;

    // ============================================================
    //  UTILS
    // ============================================================
    function getTime() {
        const d = new Date();
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function getRandomUser() { return USERS[Math.floor(Math.random() * USERS.length)]; }
    function getRandomReply() { return REPLIES[Math.floor(Math.random() * REPLIES.length)]; }

    function getBadgeHTML(badges) {
        if (!badges || !badges.length) return '';
        return badges.map(b => `<span style="font-size:10px;">${b}</span>`).join(' ');
    }

    function getRoleBadge(role) {
        const map = {
            'owner': '<span class="role-badge owner">👑 Propriétaire</span>',
            'admin': '<span class="role-badge admin">🛡️ Admin</span>',
            'moderator': '<span class="role-badge moderator">🔰 Modérateur</span>',
            'booster': '<span class="role-badge booster">⭐ Boosteur</span>'
        };
        return map[role] || '';
    }

    function scrollBottom() {
        const el = document.getElementById('messages');
        el.scrollTop = el.scrollHeight;
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function renderServers() {
        const container = document.getElementById('serverList');
        container.innerHTML = '';
        Object.keys(SERVERS).forEach(key => {
            const s = SERVERS[key];
            const div = document.createElement('div');
            div.className = 'server-icon' + (key === currentServer ? ' active' : '');
            div.innerHTML = s.icon + (s.owner ? '<span class="crown">👑</span>' : '');
            div.title = s.name;
            div.onclick = () => switchServer(key);
            container.appendChild(div);
        });
        // Add button
        const add = document.createElement('div');
        add.className = 'server-add';
        add.textContent = '+';
        add.title = 'Ajouter un serveur';
        add.onclick = () => addServer();
        container.appendChild(add);
    }

    function renderChannels(filter = '') {
        const container = document.getElementById('channelList');
        const server = SERVERS[currentServer];
        if (!server) return;
        container.innerHTML = '';

        const cats = [
            { label: '📌 Salons textuels', key: 'text' },
            { label: '🔊 Salons vocaux', key: 'voice' },
            { label: '🎮 Activités', key: 'activities' }
        ];

        cats.forEach(cat => {
            const items = server.channels[cat.key] || [];
            if (!items.length) return;
            const filtered = items.filter(c => c.name.includes(filter.toLowerCase()));
            if (!filtered.length) return;

            const catDiv = document.createElement('div');
            catDiv.className = 'channel-category';
            catDiv.textContent = cat.label + ' — ' + filtered.length;
            container.appendChild(catDiv);

            filtered.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item' + (ch.id === currentChannel && cat.key === 'text' ? ' active' : '');
                if (cat.key === 'voice') {
                    div.innerHTML = `
                        <span class="icon">${ch.icon}</span>
                        ${ch.name}
                        <span class="voice-count">
                            ${ch.users > 0 ? '<span class="dot"></span>' : ''}
                            ${ch.users}
                        </span>
                    `;
                    div.onclick = () => joinVoice(ch.id);
                } else if (cat.key === 'activities') {
                    div.innerHTML = `<span class="icon">${ch.icon}</span> ${ch.name}`;
                    div.onclick = () => joinActivity(ch.id);
                } else {
                    div.innerHTML = `
                        <span class="icon">${ch.icon}</span>
                        ${ch.name}
                        ${ch.locked ? '<span class="lock">🔒</span>' : ''}
                    `;
                    div.onclick = () => switchChannel(ch.id);
                }
                container.appendChild(div);
            });
        });
    }

    function renderMembers() {
        const container = document.getElementById('memberList');
        container.innerHTML = '';
        const online = USERS.filter(u => u.status === 'online' || u.status === 'idle' || u.role === 'owner' || u.role === 'admin');
        document.getElementById('memberCount').textContent = online.length;

        USERS.forEach(u => {
            const div = document.createElement('div');
            div.className = 'member-item';
            const statusClass = u.role === 'owner' ? 'owner' : u.role === 'admin' ? 'admin' : u.status;
            const bg = u.role === 'owner' ? 'linear-gradient(135deg,#ff6b6b,#ff0000)' :
                       u.role === 'admin' ? 'linear-gradient(135deg,#ff6b6b,#7b2ffc)' :
                       'linear-gradient(135deg,#7b2ffc,#5a1fa8)';
            div.innerHTML = `
                <div class="avatar-sm" style="background:${bg}">
                    ${u.avatar}
                    ${u.badges && u.badges.length ? `<span class="mini-badge">${u.badges[0]}</span>` : ''}
                </div>
                <span class="name">${u.name} ${getBadgeHTML(u.badges)}</span>
                <span class="status-dot ${statusClass}"></span>
            `;
            container.appendChild(div);
        });
    }

    function renderMessages() {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        MESSAGES.forEach(msg => {
            const user = USERS.find(u => u.name === msg.user) || { name: msg.user, avatar: '?', tag: '#0000', badges: [], role: 'member' };
            const div = document.createElement('div');
            div.className = 'message' + (msg.user === currentUser.name ? ' own' : '');
            const isOwner = user.role === 'owner' || msg.isOwner;
            const isAdmin = user.role === 'admin' || msg.isAdmin;
            const bg = isOwner ? 'linear-gradient(135deg,#ff6b6b,#ff0000)' :
                      isAdmin ? 'linear-gradient(135deg,#ff6b6b,#7b2ffc)' :
                      'linear-gradient(135deg,#7b2ffc,#5a1fa8)';
            div.innerHTML = `
                <div class="avatar" style="background:${bg}">
                    ${user.avatar}
                    ${user.badges && user.badges.length ? `<span class="badge-icon">${user.badges[0]}</span>` : ''}
                </div>
                <div class="content-wrap">
                    <div class="username">
                        ${msg.user}
                        <span class="tag">${user.tag || '#0000'}</span>
                        ${getBadgeHTML(user.badges)}
                        ${getRoleBadge(user.role)}
                    </div>
                    <div class="content">${msg.content}</div>
                </div>
                <div class="time">${msg.time}</div>
            `;
            container.appendChild(div);
        });
        scrollBottom();
    }

    function addMessage(user, content, isOwn = false, isAdmin = false, isOwner = false) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message' + (isOwn ? ' own' : '');
        const bg = isOwner ? 'linear-gradient(135deg,#ff6b6b,#ff0000)' :
                  isAdmin ? 'linear-gradient(135deg,#ff6b6b,#7b2ffc)' :
                  'linear-gradient(135deg,#7b2ffc,#5a1fa8)';
        const badgeHTML = user.badges ? getBadgeHTML(user.badges) : '';
        const roleBadge = isOwner ? getRoleBadge('owner') : isAdmin ? getRoleBadge('admin') : '';
        div.innerHTML = `
            <div class="avatar" style="background:${bg}">
                ${user.avatar || user.name.charAt(0)}
                ${user.badges && user.badges.length ? `<span class="badge-icon">${user.badges[0]}</span>` : ''}
            </div>
            <div class="content-wrap">
                <div class="username">
                    ${user.name}
                    <span class="tag">${user.tag || '#0000'}</span>
                    ${badgeHTML}
                    ${roleBadge}
                </div>
                <div class="content">${content}</div>
            </div>
            <div class="time">${getTime()}</div>
        `;
        container.appendChild(div);
        scrollBottom();
    }

    // ============================================================
    //  ACTIONS
    // ============================================================
    function switchServer(id) {
        if (!SERVERS[id]) return;
        currentServer = id;
        const s = SERVERS[id];
        document.getElementById('serverName').innerHTML = s.name + ' <span style="font-size:12px;color:#888;">▼</span>';
        if (s.channels.text.length) currentChannel = s.channels.text[0].id;
        renderChannels();
        renderMessages();
        const ch = s.channels.text.find(c => c.id === currentChannel);
        if (ch) {
            document.getElementById('channelName').textContent = '# ' + ch.name;
            document.getElementById('channelTopic').textContent = ch.topic || '📌';
        }
        renderServers();
        renderMembers();
    }

    function switchChannel(id) {
        const server = SERVERS[currentServer];
        if (!server) return;
        const ch = server.channels.text.find(c => c.id === id);
        if (!ch) return;
        currentChannel = id;
        document.getElementById('channelName').textContent = '# ' + ch.name;
        document.getElementById('channelTopic').textContent = ch.topic || '📌';
        renderChannels();
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, `📌 Tu as rejoint #${ch.name}`, false, false, false);
    }

    function filterChannels(val) { renderChannels(val); }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        addMessage(currentUser, text, true, false, true);
        input.value = '';
        setTimeout(() => {
            const u = getRandomUser();
            const reply = getRandomReply();
            addMessage(u, reply, false, u.role === 'admin', u.role === 'owner');
        }, 600 + Math.random() * 1200);
    }

    // ============================================================
    //  VOICE
    // ============================================================
    function joinVoice(id) {
        const server = SERVERS[currentServer];
        if (!server) return;
        const ch = server.channels.voice.find(c => c.id === id);
        if (!ch) return;
        currentVoiceChannel = id;
        const overlay = document.getElementById('voiceOverlay');
        overlay.classList.add('active');
        document.getElementById('voiceChannelName').textContent = ch.name;

        const container = document.getElementById('voiceUsers');
        container.innerHTML = `
            <div class="voice-user">
                <div class="v-avatar" style="background:linear-gradient(135deg,#7b2ffc,#5a1fa8);">T</div>
                <span>Toi</span>
                <span class="speaking">🔊</span>
            </div>
            ${ch.users > 0 ? `<div class="voice-user">
                <div class="v-avatar" style="background:linear-gradient(135deg,#ff6b6b,#7b2ffc);">DM</div>
                <span>DarkMaster</span>
                <span class="speaking">🔊</span>
            </div>` : ''}
            ${ch.users > 2 ? `<div class="voice-user">
                <div class="v-avatar" style="background:#2a2a4a;">HM</div>
                <span>HackerMan</span>
                <span style="color:#888;font-size:10px;">🔇</span>
            </div>` : ''}
            ${ch.users > 4 ? `<div class="voice-user">
                <div class="v-avatar" style="background:#7b2ffc;">SH</div>
                <span>Shadow</span>
                <span class="speaking">🔊</span>
            </div>` : ''}
        `;
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, `🔊 Rejoint **${ch.name}** (${ch.users} users)`, false, false, false);
    }

    function leaveVoice() {
        document.getElementById('voiceOverlay').classList.remove('active');
        currentVoiceChannel = null;
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, '🔇 Quitté le vocal', false, false, false);
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.querySelector('.voice-controls .mute-btn');
        btn.textContent = isMuted ? '🔇 Muet (ON)' : '🔇 Muet';
        btn.style.background = isMuted ? '#ff0000' : '#ff6b6b';
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, isMuted ? '🔇 Muet activé' : '🔊 Muet désactivé', false, false, false);
    }

    function toggleDeafen() {
        isDeafened = !isDeafened;
        const btn = document.querySelector('.voice-controls .deafen-btn');
        btn.textContent = isDeafened ? '🔊 Assourdir (ON)' : '🔊 Assourdir';
        btn.style.background = isDeafened ? '#ff0000' : '#7b2ffc';
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, isDeafened ? '🔊 Assourdi' : '🔊 Désassourdi', false, false, false);
    }

    function joinActivity(id) {
        const map = { 'amongus': '🎮 Among Us', 'poker': '♠️ Poker', 'chess': '♟️ Chess' };
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [] }, `🎮 Lancé **${map[id] || id}** !`, false, false, false);
    }

    function addServer() {
        const name = prompt('Nom du serveur :');
        if (!name) return;
        const id = 'server_' + Date.now();
        SERVERS[id] = {
            name: name,
            icon: name.charAt(0).toUpperCase(),
            owner: true,
            channels: {
                text: [{ id: 'gen', name: 'général', topic: '📌 Nouveau serveur', icon: '#' }],
                voice: [{ id: 'vc', name: 'Général', icon: '🔊', users: 0 }],
                activities: []
            }
        };
        renderServers();
        switchServer(id);
    }

    document.getElementById('adminBtn').addEventListener('click', function() {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message';
        div.style.background = 'rgba(123,47,252,0.15)';
        div.style.border = '1px solid #7b2ffc';
        div.style.borderRadius = '10px';
        div.style.padding = '14px';
        div.style.margin = '8px 0';
        div.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <span style="font-size:28px;">👑</span>
                <div>
                    <div style="font-weight:bold;color:#ff6b6b;">MODE ADMIN — Propriétaire Unique</div>

                        <button onclick="adminAction('mute')" style="background:#7b2ffc;border:none;padding:4px 14px;border-radius:8px;color:#fff;cursor:pointer;">🔇 Mute</button>
                        <button onclick="adminAction('logs')" style="background:#00ff88;border:none;padding:4px 14px;border-radius:8px;color:#000;cursor:pointer;">📋 Logs</button>
                        <button onclick="adminAction('badge')" style="background:#ff66ff;border:none;padding:4px 14px;border-radius:8px;color:#000;cursor:pointer;">🏅 Badge</button>
                        <button onclick="adminAction('delete')" style="background:#ff0000;border:none;padding:4px 14px;border-radius:8px;color:#fff;cursor:pointer;">🗑️ Supprimer</button>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(div);
        scrollBottom();
        this.style.display = 'none';
    });

    function adminAction(action) {
        const msgs = {

        div.innerHTML = `<span style="color:#ff6b6b;">✅ ${msgs[action]} 👑</span>`;

        scrollBottom();

    // ============================================================

    // ============================================================

    renderServers();
    renderChannels();

    renderMessages();
    document.getElementById('serverName').innerHTML = SERVERS[currentServer].name + ' <span style="font-size:12px;color:#888;">▼</span>';

    document.getElementById('channelTopic').textContent = '📍 Hub principal — Pas de limites';

    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();

    console.log('🔥 DarkChat Ultimate — Propriétaire: ' + currentUser.name);
    console.log('👑 Badges disponibles:', Object.keys(BADGES).join(', '));
    console.log('📡 Serveurs:', Object.keys(SERVERS).join(', '));
</script>
