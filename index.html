<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkChat - Système de Profil Discord</title>
    <!-- PEERJS POUR LE VOCAL -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            height: 98vh;
            background: #1a1a2e;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(123, 47, 252, 0.5);
            position: relative;
            border: 1px solid #2a2a4a;
        }

        /* Sidebar gauche - Serveurs */
        .sidebar-left {
            width: 80px;
            background: #12121f;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-right: 1px solid #2a2a4a;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-left::-webkit-scrollbar { width: 3px; }
        .sidebar-left::-webkit-scrollbar-thumb { background: #7b2ffc; border-radius: 10px; }

        .server-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 3px solid transparent;
            position: relative;
            flex-shrink: 0;
            color: #aaa;
        }

        .server-icon:hover {
            border-color: #7b2ffc;
            transform: scale(1.1);
            border-radius: 16px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            color: #fff;
        }

        .server-icon.active {
            border-color: #7b2ffc;
            border-radius: 16px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            color: #fff;
            box-shadow: 0 0 20px rgba(123, 47, 252, 0.3);
        }

        .server-icon .crown {
            position: absolute;
            top: -12px;
            right: -8px;
            font-size: 16px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        .server-divider {
            width: 35px;
            height: 2px;
            background: #2a2a4a;
            border-radius: 1px;
        }

        .server-add {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: transparent;
            border: 2px dashed #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #2a2a4a;
            cursor: pointer;
            transition: 0.3s;
        }

        .server-add:hover {
            border-color: #7b2ffc;
            color: #7b2ffc;
            transform: scale(1.05);
        }

        /* Sidebar serveurs */
        .sidebar-servers {
            width: 250px;
            background: #16162a;
            padding: 20px;
            border-right: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 15px;
        }

        .server-header .name {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-header .name:hover { color: #7b2ffc; }

        .channel-search {
            padding: 8px 14px;
            background: #0a0a0f;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
            margin-bottom: 15px;
        }

        .channel-search::placeholder { color: #555; }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .channel-list::-webkit-scrollbar { width: 4px; }
        .channel-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .channel-category {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 6px;
            padding-left: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .channel-category:hover { color: #aaa; }

        .channel-item {
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 14px;
            margin: 1px 0;
        }

        .channel-item:hover {
            background: #2a2a4a;
            color: #fff;
        }

        .channel-item.active {
            background: #2a2a4a;
            color: #fff;
        }

        .channel-item .icon { font-size: 16px; }
        .channel-item .lock { margin-left: auto; font-size: 11px; color: #ff6b6b; }
        .channel-item .voice-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }
        .channel-item .voice-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Chat principal */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #12121f;
        }

        .chat-header {
            padding: 12px 20px;
            background: #16162a;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 55px;
        }

        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .left h2 {
            font-size: 17px;
            color: #fff;
        }

        .chat-header .left .topic {
            color: #666;
            font-size: 12px;
            padding: 2px 10px;
            background: #0a0a0f;
            border-radius: 12px;
        }

        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chat-header .right .online {
            color: #00ff88;
            font-size: 13px;
        }

        .chat-header .right .profile-btn {
            background: #2a2a4a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }

        .chat-header .right .profile-btn:hover {
            border-color: #7b2ffc;
            transform: scale(1.05);
        }

        .chat-header .right .admin-badge {
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(123, 47, 252, 0.3);
        }

        .chat-header .right .admin-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(123, 47, 252, 0.3);
        }

        .chat-header .right .my-id {
            font-size: 11px;
            color: #666;
            padding: 3px 10px;
            background: #0a0a0f;
            border-radius: 12px;
        }

        /* Messages */
        .messages {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .message {
            padding: 5px 12px;
            border-radius: 8px;
            animation: fadeIn 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: 0.15s;
            cursor: pointer;
        }

        .message:hover { background: #1a1a2e; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #2a2a4a;
        }

        .message .avatar .badge-icon {
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 12px;
        }

        .message .avatar .online-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #12121f;
        }

        .online-dot.online { background: #00ff88; }
        .online-dot.idle { background: #ffaa00; }
        .online-dot.offline { background: #444; }

        .message .content-wrap { flex: 1; min-width: 0; }

        .message .username {
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .message .username .tag {
            font-size: 10px;
            color: #666;
            font-weight: normal;
        }

        .message .username .role-badge {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 8px;
            font-weight: bold;
        }

        .role-badge.owner { background: #ff6b6b; color: #fff; }
        .role-badge.admin { background: #7b2ffc; color: #fff; }
        .role-badge.moderator { background: #ffaa00; color: #000; }
        .role-badge.booster { background: #ff66ff; color: #fff; }

        .message .content {
            font-size: 14px;
            word-wrap: break-word;
            margin-top: 1px;
        }

        .message .time {
            font-size: 10px;
            color: #444;
            margin-left: 8px;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .message.own .content-wrap {
            background: #2a2a4a;
            padding: 6px 14px;
            border-radius: 12px;
        }

        /* Input */
        .input-area {
            padding: 12px 20px;
            background: #16162a;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area .emoji-btn {
            font-size: 20px;
            cursor: pointer;
            color: #555;
            transition: 0.2s;
            padding: 5px;
        }
        .input-area .emoji-btn:hover { color: #fff; }

        .input-area input {
            flex: 1;
            padding: 10px 18px;
            background: #0a0a0f;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus { box-shadow: 0 0 20px rgba(123, 47, 252, 0.15); }

        .input-area button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(123, 47, 252, 0.3);
        }

        /* Sidebar droit - Membres */
        .sidebar-right {
            width: 240px;
            background: #16162a;
            border-left: 1px solid #2a2a4a;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-right .title {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .member-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .member-list::-webkit-scrollbar { width: 4px; }
        .member-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: 0.15s;
            cursor: pointer;
        }

        .member-item:hover { background: #1a1a2e; }

        .member-item .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #2a2a4a;
        }

        .member-item .avatar-sm .mini-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            font-size: 9px;
        }

        .member-item .name {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 3px;
            flex: 1;
        }

        .member-item .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online { background: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .status-dot.idle { background: #ffaa00; }
        .status-dot.offline { background: #444; }
        .status-dot.admin { background: #7b2ffc; box-shadow: 0 0 8px rgba(123,47,252,0.4); }
        .status-dot.owner { background: #ff6b6b; box-shadow: 0 0 8px rgba(255,107,107,0.4); }

        /* ===== PROFIL MODAL ===== */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .profile-modal.active { display: flex; }

        .profile-modal .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            border: 1px solid #2a2a4a;
            box-shadow: 0 0 60px rgba(123, 47, 252, 0.3);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .profile-modal .modal-content .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
            z-index: 10;
        }

        .profile-modal .modal-content .close-btn:hover { color: #fff; }

        /* Banner */
        .profile-banner {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #7b2ffc, #2a2a4a);
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .profile-banner .banner-edit {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-banner .banner-edit:hover { background: rgba(0,0,0,0.8); }

        /* Avatar dans le profil */
        .profile-avatar-container {
            position: relative;
            margin-top: -60px;
            padding: 0 20px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .profile-avatar-container .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a2a4a;
            border: 4px solid #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
        }

        .profile-avatar-container .profile-avatar .edit-avatar {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #7b2ffc;
            border-radius: 50%;
            padding: 6px;
            cursor: pointer;
            font-size: 14px;
            border: 2px solid #1a1a2e;
            transition: 0.3s;
        }

        .profile-avatar-container .profile-avatar .edit-avatar:hover { transform: scale(1.1); }

        .profile-avatar-container .profile-name-section {
            flex: 1;
            padding-bottom: 10px;
        }

        .profile-avatar-container .profile-name-section .name {
            font-size: 22px;
            font-weight: bold;
        }

        .profile-avatar-container .profile-name-section .tag {
            color: #888;
            font-size: 14px;
        }

        .profile-avatar-container .profile-name-section .status-text {
            font-size: 13px;
            margin-top: 4px;
        }

        .status-text.online { color: #00ff88; }
        .status-text.idle { color: #ffaa00; }
        .status-text.offline { color: #444; }

        /* Badges dans le profil */
        .profile-badges-section {
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .profile-badges-section .badge-item {
            background: #2a2a4a;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Infos du profil */
        .profile-info-section {
            padding: 10px 20px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .profile-info-section .info-card {
            background: #0a0a0f;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .profile-info-section .info-card .label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .profile-info-section .info-card .value {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Edit section */
        .profile-edit-section {
            padding: 15px 20px 20px;
            border-top: 1px solid #2a2a4a;
            background: #12121f;
            border-radius: 0 0 20px 20px;
        }

        .profile-edit-section .edit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .profile-edit-section .edit-row .edit-input {
            flex: 1;
            padding: 10px 16px;
            background: #0a0a0f;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .profile-edit-section .edit-row .edit-input:focus { border-color: #7b2ffc; }

        .profile-edit-section .edit-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .profile-edit-section .edit-btn:hover { transform: scale(1.02); }

        .file-input-hidden { display: none; }

        /* ===== VOICE OVERLAY ===== */
        .voice-overlay {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 12px 22px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 0 50px rgba(123, 47, 252, 0.25);
            backdrop-filter: blur(15px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95%;
        }

        .voice-overlay.active { display: flex; }

        .voice-overlay .voice-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .voice-overlay .voice-info .channel-name {
            font-weight: bold;
            font-size: 14px;
        }

        .voice-overlay .voice-info .status-text {
            color: #00ff88;
            font-size: 12px;
        }

        .voice-overlay .voice-users-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .voice-overlay .voice-users-list .v-user {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 6px;
            background: #0a0a0f;
            border-radius: 16px;
            font-size: 12px;
        }

        .voice-overlay .voice-users-list .v-user .v-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            background: linear-gradient(135deg, #7b2ffc, #5a1fa8);
            background-size: cover;
            background-position: center;
        }

        .voice-overlay .voice-users-list .v-user .speaking {
            color: #00ff88;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        .voice-overlay .voice-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .voice-overlay .voice-controls button {
            padding: 5px 12px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 11px;
        }

        .voice-overlay .voice-controls button:hover { transform: scale(1.05); }
        .voice-overlay .voice-controls .mute-btn { background: #ff6b6b; color: #fff; }
        .voice-overlay .voice-controls .deafen-btn { background: #7b2ffc; color: #fff; }
        .voice-overlay .voice-controls .leave-btn { background: #ff0000; color: #fff; }
        .voice-overlay .voice-controls .join-btn { background: #00ff88; color: #000; }

        /* Responsive */
        @media (max-width: 1100px) { .sidebar-right { display: none; } }
        @media (max-width: 800px) {

    function initPeer() {
        peer = new Peer(undefined, {

        });

            console.error(err);
            addMessage('Système', '❌ Erreur PeerJS: ' + err.message);
        });

        peer.on('call', (incomingCall) => {
            if (inVoice) {
                acceptCall(incomingCall);
            } else {
                incomingCall.close();
            }
        });

        peer.on('close', () => {
            addMessage('Système', '🔴 Déconnecté de PeerJS');
            leaveVoice();
        });
    }

    // ============================================================
    //  VOICE - REJOINDRE UN SALON
    // ============================================================
    function joinVoice(channelId) {
        if (!peer) {
            initPeer();
            setTimeout(() => joinVoice(channelId), 500);
            return;
        }

        if (inVoice && currentVoiceChannel === channelId) {
            addMessage('Système', '🔊 Déjà dans ce salon vocal');
            return;
        }

        if (inVoice) {
            leaveVoice();
        }

        currentVoiceChannel = channelId;
        inVoice = true;

        const server = SERVERS[currentServer];
        let channelName = channelId;
        if (server) {
            const ch = server.channels.voice.find(c => c.id === channelId);
            if (ch) channelName = ch.name;
        }

        const overlay = document.getElementById('voiceOverlay');
        overlay.classList.add('active');
        document.getElementById('voiceChannelName').textContent = channelName;

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                updateVoiceUsers();
                addMessage('Système', `🔊 Rejoint le salon vocal **${channelName}**`);
                
                // Broadcast aux autres utilisateurs du salon
                // On simule des utilisateurs pour l'exemple

                    setTimeout(() => {

                            voiceUsers.push(id);

                            addMessage('Système', `👤 ${id.substring(0,6)} a rejoint le vocal`);
                            // Simuler un appel

                            }
                        }
                    }, 2000 + index * 3000);
                });
            })
            .catch(err => {
                addMessage('Système', '❌ Erreur micro: ' + err.message);
                inVoice = false;
                overlay.classList.remove('active');
            });
    }

    function leaveVoice() {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        Object.keys(calls).forEach(key => {
            if (calls[key]) {
                calls[key].close();
                delete calls[key];
            }
        });
        remoteStreams = {};
        voiceUsers = [];
        inVoice = false;
        currentVoiceChannel = null;
        document.getElementById('voiceOverlay').classList.remove('active');
        updateVoiceUsers();
        addMessage('Système', '🔇 Quitté le salon vocal');
    }

    function acceptCall(incomingCall) {
        if (!localStream) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    incomingCall.answer(stream);
                    setupCall(incomingCall);
                })
                .catch(e => {
                    addMessage('Système', '❌ Erreur micro: ' + e.message);
                });
        } else {
            incomingCall.answer(localStream);
            setupCall(incomingCall);
        }
    }

    function setupCall(callObj) {
        const peerId = callObj.peer;
        calls[peerId] = callObj;
        if (!voiceUsers.includes(peerId)) voiceUsers.push(peerId);
        updateVoiceUsers();

        callObj.on('stream', (stream) => {
            remoteStreams[peerId] = stream;
            const audio = new Audio();
            audio.srcObject = stream;
            audio.play().catch(e => console.log(e));
            addMessage('Système', `🔊 Connecté à **${peerId.substring(0,6)}**`);
            updateVoiceUsers();
        });

        callObj.on('close', () => {
            addMessage('Système', `🔇 Déconnecté de ${peerId.substring(0,6)}`);
            delete calls[peerId];
            delete remoteStreams[peerId];
            voiceUsers = voiceUsers.filter(p => p !== peerId);
            updateVoiceUsers();
        });

        callObj.on('error', (err) => {
            console.error(err);
            delete calls[peerId];
            voiceUsers = voiceUsers.filter(p => p !== peerId);
            updateVoiceUsers();
        });
    }

    function updateVoiceUsers() {
        const container = document.getElementById('voiceUsersList');
        container.innerHTML = '';
        
        const self = document.createElement('div');
        self.className = 'v-user';
        const avatarStyle = currentUser.avatarFile ? `background-image: url('${currentUser.avatarFile}'); background-size: cover; background-position: center;` : 'background:linear-gradient(135deg,#7b2ffc,#5a1fa8);';
        self.innerHTML = `
            <div class="v-avatar" style="${avatarStyle}">${!currentUser.avatarFile ? 'T' : ''}</div>
            <span>Toi</span>
            <span class="speaking">🔊</span>
        `;
        container.appendChild(self);

        voiceUsers.forEach(id => {
            if (id === myId) return;
            const div = document.createElement('div');
            div.className = 'v-user';
            const isSpeaking = remoteStreams[id] ? true : false;
            div.innerHTML = `
                <div class="v-avatar" style="background:linear-gradient(135deg,#ff6b6b,#7b2ffc);">${id.substring(0,2)}</div>
                <span>${id.substring(0,6)}</span>
                ${isSpeaking ? '<span class="speaking">🔊</span>' : ''}
            `;
            container.appendChild(div);
        });
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.querySelector('.voice-controls .mute-btn');
        btn.textContent = isMuted ? '🔇 Muet (ON)' : '🔇 Muet';
        btn.style.background = isMuted ? '#ff0000' : '#ff6b6b';
        if (localStream) {
            localStream.getTracks().forEach(t => t.enabled = !isMuted);
        }
        addMessage('Système', isMuted ? '🔇 Micro coupé' : '🔊 Micro réactivé');
    }

    function toggleDeafen() {
        isDeafened = !isDeafened;
        const btn = document.querySelector('.voice-controls .deafen-btn');
        btn.textContent = isDeafened ? '🔊 Assourdir (ON)' : '🔊 Assourdir';
        btn.style.background = isDeafened ? '#ff0000' : '#7b2ffc';
        Object.values(remoteStreams).forEach(stream => {
            stream.getTracks().forEach(t => t.enabled = !isDeafened);
        });
        addMessage('Système', isDeafened ? '🔊 Assourdi' : '🔊 Désassourdi');
    }

    function renderChannels(filter = '') {
        const container = document.getElementById('channelList');
        const server = SERVERS[currentServer];
        if (!server) return;
        container.innerHTML = '';

        const cats = [
            { label: '📌 Salons textuels', key: 'text' },
            { label: '🔊 Salons vocaux', key: 'voice' }
        ];

        cats.forEach(cat => {
            const items = server.channels[cat.key] || [];
            if (!items.length) return;
            const filtered = items.filter(c => c.name.includes(filter.toLowerCase()));
            if (!filtered.length) return;

            const catDiv = document.createElement('div');
            catDiv.className = 'channel-category';
            catDiv.textContent = cat.label + ' — ' + filtered.length;
            container.appendChild(catDiv);

            filtered.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item' + (ch.id === currentChannel && cat.key === 'text' ? ' active' : '');
                if (cat.key === 'voice') {
                    const isActive = inVoice && currentVoiceChannel === ch.id;
                    div.innerHTML = `

                    div.onclick = () => switchChannel(ch.id);

                container.appendChild(div);

                <div class="avatar-sm" style="${avatarStyle || `background:${bg}`}">
                    ${!u.avatarFile ? u.avatar : ''}
                    ${u.badges && u.badges.length ? `<span class="mini-badge">${u.badges[0]}</span>` : ''}
                </div>
                <span class="name">${u.name} ${getBadgeHTML(u.badges)}</span>
                <span class="status-dot ${statusClass}"></span>
            `;
            div.onclick = () => openProfile(u.name);
            container.appendChild(div);
        });
    }

    function renderMessages() {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        MESSAGES.forEach(msg => {
            const user = USERS.find(u => u.name === msg.user) || { name: msg.user, avatar: '?', tag: '#0000', badges: [], role: 'member', avatarFile: null, status: 'offline' };
            const div = document.createElement('div');
            div.className = 'message' + (msg.user === currentUser.name ? ' own' : '');
            const isOwner = user.role === 'owner' || msg.isOwner;
            const isAdmin = user.role === 'admin' || msg.isAdmin;
            const bg = isOwner ? 'linear-gradient(135deg,#ff6b6b,#ff0000)' :
                      isAdmin ? 'linear-gradient(135deg,#ff6b6b,#7b2ffc)' :
                      'linear-gradient(135deg,#7b2ffc,#5a1fa8)';
            const avatarStyle = user.avatarFile ? `background-image: url('${user.avatarFile}'); background-size: cover; background-position: center;` : '';
            const statusDot = user.status === 'online' ? 'online' : user.status === 'idle' ? 'idle' : 'offline';
            div.innerHTML = `
                <div class="avatar" style="${avatarStyle || `background:${bg}`}" onclick="openProfile('${msg.user}')">
                    ${!user.avatarFile ? user.avatar : ''}
                    ${user.badges && user.badges.length ? `<span class="badge-icon">${user.badges[0]}</span>` : ''}
                    <span class="online-dot ${statusDot}"></span>
                </div>
                <div class="content-wrap">
                    <div class="username">
                        ${msg.user}
                        <span class="tag">${user.tag || '#0000'}</span>
                        ${getBadgeHTML(user.badges)}
                        ${getRoleBadge(user.role)}
                    </div>
                    <div class="content">${msg.content}</div>
                </div>
                <div class="time">${msg.time}</div>
            `;
            container.appendChild(div);
        });
        scrollBottom();
    }

    function addMessage(user, content, isOwn = false, isAdmin = false, isOwner = false) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message' + (isOwn ? ' own' : '');
        const bg = isOwner ? 'linear-gradient(135deg,#ff6b6b,#ff0000)' :
                  isAdmin ? 'linear-gradient(135deg,#ff6b6b,#7b2ffc)' :
                  'linear-gradient(135deg,#7b2ffc,#5a1fa8)';
        const avatarStyle = user.avatarFile ? `background-image: url('${user.avatarFile}'); background-size: cover; background-position: center;` : '';
        const statusDot = user.status === 'online' ? 'online' : user.status === 'idle' ? 'idle' : 'offline';
        const badgeHTML = user.badges ? getBadgeHTML(user.badges) : '';
        const roleBadge = isOwner ? getRoleBadge('owner') : isAdmin ? getRoleBadge('admin') : '';
        div.innerHTML = `
            <div class="avatar" style="${avatarStyle || `background:${bg}`}" onclick="openProfile('${user.name}')">
                ${!user.avatarFile ? (user.avatar || user.name.charAt(0)) : ''}
                ${user.badges && user.badges.length ? `<span class="badge-icon">${user.badges[0]}</span>` : ''}
                <span class="online-dot ${statusDot}"></span>
            </div>
            <div class="content-wrap">
                <div class="username">
                    ${user.name}
                    <span class="tag">${user.tag || '#0000'}</span>
                    ${badgeHTML}
                    ${roleBadge}
                </div>
                <div class="content">${content}</div>
            </div>
            <div class="time">${getTime()}</div>
        `;
        container.appendChild(div);
        scrollBottom();
    }

    // ============================================================
    //  ACTIONS
    // ============================================================
    function switchServer(id) {
        if (!SERVERS[id]) return;
        currentServer = id;
        const s = SERVERS[id];
        document.getElementById('serverName').innerHTML = s.name + ' <span style="font-size:12px;color:#888;">▼</span>';
        if (s.channels.text.length) currentChannel = s.channels.text[0].id;
        renderChannels();
        renderMessages();
        const ch = s.channels.text.find(c => c.id === currentChannel);
        if (ch) {
            document.getElementById('channelName').textContent = '# ' + ch.name;
            document.getElementById('channelTopic').textContent = ch.topic || '📌';
        }
        renderServers();
        renderMembers();
        // Quitter le vocal si on change de serveur
        if (inVoice) leaveVoice();
    }

    function switchChannel(id) {
        const server = SERVERS[currentServer];
        if (!server) return;
        const ch = server.channels.text.find(c => c.id === id);
        if (!ch) return;
        currentChannel = id;
        document.getElementById('channelName').textContent = '# ' + ch.name;
        document.getElementById('channelTopic').textContent = ch.topic || '📌';
        renderChannels();
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [], status: 'online', avatarFile: null }, `📌 Rejoint #${ch.name}`, false, false, false);
    }

    function filterChannels(val) { renderChannels(val); }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        currentUser.messages++;
        addMessage(currentUser, text, true, false, true);
        input.value = '';
        setTimeout(() => {
            const u = getRandomUser();
            const reply = getRandomReply();
            u.messages = (u.messages || 0) + 1;
            addMessage(u, reply, false, u.role === 'admin', u.role === 'owner');
        }, 600 + Math.random() * 1200);
    }

    function addServer() {
        const name = prompt('Nom du serveur :');
        if (!name) return;
        const id = 'server_' + Date.now();
        SERVERS[id] = {
            name: name,
            icon: name.charAt(0).toUpperCase(),
            owner: true,
            channels: {
                text: [{ id: 'gen', name: 'général', topic: '📌 Nouveau serveur', icon: '#' }],
                voice: [{ id: 'vc', name: 'Général', icon: '🔊' }]
            }
        };
        renderServers();
        switchServer(id);
    }

    // ============================================================
    //  PROFIL
    // ============================================================
    function openProfile(username) {
        const user = getUserByName(username);
        if (!user && username !== 'tu') {
            if (username === 'tu') {
                showProfileModal(currentUser);
                return;
            }
            return;
        }
        const target = user || currentUser;
        showProfileModal(target);
    }

    function showProfileModal(user) {
        const modal = document.getElementById('profileModal');
        modal.classList.add('active');

        const avatarEl = document.getElementById('profileAvatar');
        const avatarText = document.getElementById('profileAvatarText');
        if (user.avatarFile) {
            avatarEl.style.backgroundImage = `url('${user.avatarFile}')`;
            avatarEl.style.backgroundSize = 'cover';
            avatarEl.style.backgroundPosition = 'center';
            avatarText.style.display = 'none';
        } else {
            avatarEl.style.backgroundImage = '';
            avatarText.style.display = 'flex';
            avatarText.textContent = user.avatar || user.name.charAt(0);
        }

        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileTag').textContent = user.tag || '#0000';
        document.getElementById('profileStatus').textContent = getStatusText(user.status || 'online');
        document.getElementById('profileStatus').className = 'status-text ' + (user.status || 'online');

        const badgesContainer = document.getElementById('profileBadges');
        badgesContainer.innerHTML = '';
        if (user.badges && user.badges.length) {
            user.badges.forEach(b => {
                const span = document.createElement('span');
                span.className = 'badge-item';
                span.textContent = b + ' ' + (BADGES[b]?.name || '');
                span.style.background = BADGES[b]?.color || '#2a2a4a';
                badgesContainer.appendChild(span);
            });
        }

        document.getElementById('profileRole').textContent = getRoleName(user.role || 'member');
        document.getElementById('profileSince').textContent = user.since || 'Aujourd\'hui';
        document.getElementById('profileMessages').textContent = user.messages || 0;
        document.getElementById('profileVoice').textContent = user.voiceTime || '0h 0m';

        const editSection = document.getElementById('editSection');
        if (user.name === currentUser.name) {
            editSection.style.display = 'block';
            document.getElementById('editNameInput').value = user.name;
            document.getElementById('editTagInput').value = user.tag || '#0001';
        } else {
            editSection.style.display = 'none';
        }
    }

    function closeProfile() {
        document.getElementById('profileModal').classList.remove('active');
    }

    function updateProfile() {
        const newName = document.getElementById('editNameInput').value.trim();
        const newTag = document.getElementById('editTagInput').value.trim();
        if (!newName) return;
        
        const oldName = currentUser.name;
        currentUser.name = newName;
        if (newTag) currentUser.tag = newTag.startsWith('#') ? newTag : '#' + newTag;
        
        const userIndex = USERS.findIndex(u => u.name === oldName);
        if (userIndex !== -1) {
            USERS[userIndex].name = newName;
            USERS[userIndex].tag = currentUser.tag;
        }
        
        MESSAGES.forEach(msg => {
            if (msg.user === oldName) msg.user = newName;
        });
        
        renderMembers();
        renderMessages();
        showProfileModal(currentUser);
        
        addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [], status: 'online', avatarFile: null }, `✏️ **${oldName}** a changé son pseudo en **${newName}**`, false, false, false);
    }

    function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const dataUrl = e.target.result;
            currentUser.avatarFile = dataUrl;
            
            const userIndex = USERS.findIndex(u => u.name === currentUser.name);
            if (userIndex !== -1) {
                USERS[userIndex].avatarFile = dataUrl;
            }
            
            renderMembers();
            renderMessages();
            showProfileModal(currentUser);
            
            addMessage({ name: 'Système', avatar: '⚡', tag: '#0000', badges: [], status: 'online', avatarFile: null }, `📷 **${currentUser.name}** a changé sa photo de profil !`, false, false, false);
        };
        reader.readAsDataURL(file);
    }

    // ============================================================
    //  ADMIN
    // ============================================================
    document.getElementById('adminBtn').addEventListener('click', function() {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message';
        div.style.background = 'rgba(123,47,252,0.15)';
        div.style.border = '1px solid #7b2ffc';
        div.style.borderRadius = '10px';
        div.style.padding = '14px';
        div.style.margin = '8px 0';
        div.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <span style="font-size:28px;">👑</span>
                <div>
                    <div style="font-weight:bold;color:#ff6b6b;">MODE ADMIN — Propriétaire Unique</div>
                    <div style="font-size:13px;color:#aaa;">Tu contrôles tout, sur tous les serveurs.</div>
                    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
                        <button onclick="adminAction('ban')" style="background:#ff6b6b;border:none;padding:4px 14px;border-radius:8px;color:#fff;cursor:pointer;">🔨 Bannir</button>
                        <button onclick="adminAction('kick')" style="background:#ffaa00;border:none;padding:4px 14px;border-radius:8px;color:#000;cursor:pointer;">👢 Kick</button>
                        <button onclick="adminAction('mute')" style="background:#7b2ffc;border:none;padding:4px 14px;border-radius:8px;color:#fff;cursor:pointer;">🔇 Mute</button>
                        <button onclick="adminAction('logs')" style="background:#00ff88;border:none;padding:4px 14px;border-radius:8px;color:#000;cursor:pointer;">📋 Logs</button>
                        <button onclick="adminAction('badge')" style="background:#ff66ff;border:none;padding:4px 14px;border-radius:8px;color:#000;cursor:pointer;">🏅 Badge</button>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(div);
        scrollBottom();
        this.style.display = 'none';
    });

    function adminAction(action) {
        const msgs = {
            'ban': '🔨 Utilisateur banni par le propriétaire.',
            'kick': '👢 Utilisateur kické par le propriétaire.',
            'mute': '🔇 Utilisateur mute pour 24h.',
            'logs': '📋 Logs: Rien à signaler.',
            'badge': '🏅 Badge "Légende" attribué.'
        };
        const div = document.createElement('div');
        div.className = 'message';
        div.style.background = 'rgba(255,107,107,0.1)';
        div.style.border = '1px solid #ff6b6b';
        div.style.borderRadius = '10px';
        div.style.padding = '8px 14px';
        div.style.margin = '6px 0';
        div.innerHTML = `<span style="color:#ff6b6b;">✅ ${msgs[action]} 👑</span>`;
        document.getElementById('messages').appendChild(div);
        scrollBottom();
    }

    // ============================================================
    //  AUTO MESSAGES
    // ============================================================
    setTimeout(() => {
        const auto = [
            "Qui est chaud pour un raid ?",
            "J'ai trouvé une faille sur un site du gouvernement",
            "DarkChat V2 c'est le futur",
            "Ici on parle de tout, même des trucs interdits",
            "Bientôt un leak de 50 millions de comptes",
            "Vive l'anarchie numérique",
            "Le propriétaire est là 👑",
            "Serveur 100% sans censure"
        ];
        let i = 0;
        const interval = setInterval(() => {
            if (i >= auto.length) { clearInterval(interval); return; }
            const u = getRandomUser();
            addMessage(u, auto[i], false, u.role === 'admin', u.role === 'owner');
            i++;
        }, 4000);
    }, 1500);

    // ============================================================
    //  INIT
    // ============================================================
    renderServers();
    renderChannels();
    renderMembers();
    renderMessages();
    document.getElementById('serverName').innerHTML = SERVERS[currentServer].name + ' <span style="font-size:12px;color:#888;">▼</span>';
    document.getElementById('channelName').textContent = '# général';
    document.getElementById('channelTopic').textContent = '📍 Hub principal — Pas de limites';

    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('profileModal').addEventListener('click', function(e) {
        if (e.target === this) closeProfile();
    });

    // Initialiser PeerJS
    initPeer();

    console.log('🔥 DarkChat — Profil + Vocal Public');
    console.log('👑 Propriétaire: ' + currentUser.name);
    console.log('📸 Clique sur l\'avatar dans le profil pour changer ta PP');
    console.log('🔊 Clique sur un salon vocal pour parler !');
</script>
